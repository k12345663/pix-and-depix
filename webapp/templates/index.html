<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Truth | Pix & Depix</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="container">
        <header class="hero">
            <div class="badge">Advanced Image Forensics</div>
            <h1>Pixelate & Demux</h1>
            <p>State-of-the-art orthogonal domain multiplexing and forensic recovery.</p>
        </header>

        <main>
            <div class="glass-panel main-panel">
                <form id="uploadForm">
                    <div class="file-drop-area" id="dropArea">
                        <div class="upload-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        </div>
                        <span class="choose-file-button">Browse Files</span>
                        <span class="file-message">or drag & drop your image here</span>
                        <input class="file-input" type="file" name="image" id="imageInput" accept="image/*" required>
                    </div>

                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <img id="imagePreview" alt="Image Preview">
                        <button type="button" class="remove-btn" id="removeBtn" aria-label="Remove image">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>

                    <div class="mode-selection">
                        <h2>Select Operation</h2>
                        <div class="mode-cards">
                            <label class="mode-card">
                                <input type="radio" name="script_type" value="pixelate2" checked>
                                <div class="card-content">
                                    <div class="card-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                    </div>
                                    <h3>Pixelate & Mux</h3>
                                    <p>Hide details in orthogonal domains</p>
                                </div>
                            </label>

                            <label class="mode-card">
                                <input type="radio" name="script_type" value="de">
                                <div class="card-content">
                                    <div class="card-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                                    </div>
                                    <h3>Depixelate & Demux</h3>
                                    <p>Recover and verify hidden data</p>
                                </div>
                            </label>

                            <label class="mode-card">
                                <input type="radio" name="script_type" value="check_pixelated">
                                <div class="card-content">
                                    <div class="card-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
                                    </div>
                                    <h3>Check Pixelation</h3>
                                    <p>Detect if image is degraded</p>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="options-group" id="presetGroup">
                        <label for="presetSelect">Multiplexing Preset</label>
                        <div class="select-wrapper">
                            <select name="preset" id="presetSelect" class="custom-select">
                                <option value="clear">Clear (High Fidelity)</option>
                                <option value="retro">Retro (Stylized)</option>
                                <option value="poster">Poster (High Contrast)</option>
                            </select>
                            <svg class="select-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">Execute Operation</span>
                        <div class="spinner" id="spinner" style="display: none;"></div>
                    </button>
                </form>
            </div>

            <div class="glass-panel result-section" id="resultSection" style="display: none;">
                <h2>Operation Results</h2>
                <div class="result-cards">
                    <div class="result-card" id="pixelatedCard">
                        <div class="card-header">
                            <h3>Output Image</h3>
                            <span class="status-badge" id="outputBadge">Processed</span>
                        </div>
                        <div class="image-wrapper" id="pixelatedWrapper">
                            <img id="pixelatedResult" src="" alt="Processed">
                        </div>
                        <div class="check-result-wrapper" id="checkResultWrapper" style="display: none; padding: 2rem; text-align: center;">
                            <h4 id="checkResultText" style="font-size: 1.5rem; margin-bottom: 1rem;"></h4>
                            <p id="checkResultDetails" style="color: #9ca3af;"></p>
                        </div>
                    </div>
                    
                    <div class="result-card" id="restoredCard" style="display: none;">
                        <div class="card-header">
                            <h3>Demuxed / Restored Data</h3>
                            <span class="status-badge success">Recovered</span>
                        </div>
                        <div class="image-wrapper">
                            <img id="restoredResult" src="" alt="Depixelated">
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <a href="#" class="download-btn" id="downloadAllBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Full Archive
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
